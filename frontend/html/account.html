<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Account</title>

  <link rel="stylesheet" href="/css/home.css" />
  <link rel="stylesheet" href="/css/account.css" />
  <link rel="stylesheet" href="/css/navigation.css" />
</head>

<body>
  <nav>
    <section class="nav-brand">
      <img src="/images/logo.jpeg" width="60" height="60" alt="Logo">
      <span class="nav-logo">MEDI<span>QUEUE</span></span>
    </section>

          <button class="back-btn" id="backBtn"> ← Back
</button>
  </nav>

  <main class="account-container">
    <h1>My Account</h1>

    <p class="account-subtitle">
      Manage your profile, settings, and sessions
    </p>

    <section class="account-box">
      <button 
        class="account-btn"
        onclick="window.location.href='/html/profile.html'">
        Profile
      </button>
      <button class="account-btn logout">
        Log Out
      </button>
    </section>
  </main>

  <script type="module" src="/js/account.js"></script>
  <script>
  function goToAccount() {
    sessionStorage.setItem(
      "previousPageBeforeAccount",
      window.location.pathname + window.location.search
    );

    window.location.href = "/html/account.html";
  }
</script>
</body>
</html>
