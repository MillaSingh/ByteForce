<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password - MEDIQUEUE</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body>
    <nav>
      <div class="nav-brand">
        <img src="/images/logo.jpeg" alt="MEDIQUEUE" width="50" height="50" />
        <div class="nav-logo">MEDI<span>QUEUE</span></div>
      </div>
    </nav>
    <main>
      <section
        id="forgot-card"
        style="
          background: rgb(239, 233, 233);
          padding: 40px;
          border-radius: 12px;
          box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
          max-width: 400px;
          margin: 0 auto;
        "
      >
        <!-- Step 1: Enter email -->
        <div id="step-email">
          <h2 style="text-align: center; margin-bottom: 12px; color: #333">
            Forgot Password
          </h2>
          <p style="text-align: center; color: #666; margin-bottom: 30px">
            Enter your email address and we'll send you a link to reset your
            password.
          </p>

          <form id="forgotPasswordForm">
            <label for="email">Email Address</label>
            <input
              type="email"
              id="email"
              required
              placeholder="you@example.com"
            />
            <button type="submit" id="sendBtn">Send Reset Link</button>
          </form>

          <div
            id="errorMsg"
            style="
              color: red;
              text-align: center;
              margin-top: 10px;
              display: none;
            "
          ></div>
        </div>

        <!-- Step 2: Success confirmation -->
        <div id="step-success" style="display: none; text-align: center">
          <div style="font-size: 48px; margin-bottom: 16px">📧</div>
          <h2 style="color: #333; margin-bottom: 12px">Check Your Email</h2>
          <p style="color: #666; margin-bottom: 8px">
            We sent a password reset link to:
          </p>
          <p
            id="sentToEmail"
            style="font-weight: 600; color: #333; margin-bottom: 24px"
          ></p>
          <p style="color: #888; font-size: 14px; margin-bottom: 24px">
            Didn't receive it? Check your spam folder or
            <a href="#" id="resendLink" style="color: #4285f4"
              >resend the email</a
            >.
          </p>
          <div
            id="resendMsg"
            style="
              color: green;
              font-size: 14px;
              margin-bottom: 16px;
              display: none;
            "
          ></div>
        </div>

        <p style="text-align: center; margin-top: 20px">
          <a href="/html/login.html" style="color: #666; font-size: 14px"
            >← Back to Login</a
          >
        </p>
      </section>
    </main>

    <script type="module" src="/js/forgotPassword.js"></script>
  </body>
</html>
