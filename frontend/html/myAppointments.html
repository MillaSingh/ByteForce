<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>My Appointments | MEDIQUEUE</title>

  <link rel="stylesheet" href="/css/navigation.css" />
  <link rel="stylesheet" href="/css/myAppointments.css" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />

</head>

<body>

  <!-- NAV -->
  <nav>

    <section class="nav-brand">
      <img src="/images/logo.jpeg" width="60" height="60" alt="Logo" />

      <span class="nav-logo">
        MEDI<span>QUEUE</span>
      </span>
    </section>

    <ul class="nav-links">
      <li><a href="/html/home.html">Home</a></li>
      <li><a href="/html/clinics.html">Clinics</a></li>
      <li><a class="active" href="/html/myAppointments.html">My Appointments</a></li>
      <li><a href="/html/queue.html">Queue</a></li>
    </ul>

    <button class="nav-cta account-btn" onclick="goToAccount()">
      Account
    </button>

  </nav>

  <!-- HERO -->
  <header class="hero">
    <h1>My Appointments</h1>
    <p>Track your medical bookings in one place</p>
  </header>

  <!-- MAIN -->
  <main>

    <section class="container-card">

      <!-- DASHBOARD -->
      <section id="dashboard">

        <header class="summary-header">
          <h2>Your Dashboard</h2>
          <p id="summary-text">Loading appointments...</p>
        </header>

        <section class="filters">

          <button onclick="filterAppointments('all')">All</button>
          <button onclick="filterAppointments('upcoming')">Upcoming</button>
          <button onclick="filterAppointments('past')">Past</button>

        </section>

        <section id="loading" class="center">
          Loading appointments...
        </section>

        <section id="empty" class="center" style="display:none;">
          No appointments yet
        </section>

        <!-- UPCOMING -->
        <section class="group">
          <h3>Upcoming</h3>
          <section id="upcoming" class="list"></section>
        </section>

        <!-- PAST -->
        <section class="group">
          <h3>Past</h3>
          <section id="past" class="list"></section>
        </section>

      </section>

    </section>

  </main>

  <!-- FOOTER -->
  <footer>
    © 2026 MediQueue · All rights reserved ·
    <a href="#" style="color: rgba(255, 255, 255, 0.6); text-decoration:none;">
      Privacy Policy
    </a>
  </footer>

  <script src="/js/myAppointments.js"></script>

  <script>
    function goToAccount() {
      sessionStorage.setItem(
        "previousPageBeforeAccount",
        window.location.pathname + window.location.search
      );

      window.location.href = "/html/account.html";
    }
  </script>

</body>
</html>
