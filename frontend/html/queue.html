<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Queue | MEDIQUEUE</title>

  <link rel="stylesheet" href="/css/queue.css">
  <link rel="stylesheet" href="/css/navigation.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&amp;family=DM+Sans:wght@300;400;500;600&amp;display=swap"
    rel="stylesheet"
  >
</head>

<body>

  <!-- NAV -->
  <nav>
    <section class="nav-brand">
      <img src="/images/logo.jpeg" width="60" height="60" alt="Logo">
      <span class="nav-logo">MEDI<span>QUEUE</span></span>
    </section>

    <ul class="nav-links">
      <li><a href="/html/home.html">Home</a></li>
      <li><a href="/html/clinics.html">Clinics</a></li>
      <li><a href="/html/myAppointments.html">My Appointments</a></li>
      <li><a class="active" href="/html/queue.html">Queue</a></li>
    </ul>

    <button class="nav-cta account-btn" onclick="goToAccount()">
      Account
    </button>
  </nav>

  <!-- HERO -->
  <header class="hero">
    <h1>Queue</h1>
    <p>Track your current clinic queue position</p>
  </header>

  <!-- MAIN -->
  <main>
    <section class="container-card">

      <section class="summary-header">
        <h2>Your Position</h2>
        <p id="summary-text">Loading your position...</p>
      </section>

      <section id="loading" class="center">
        Loading your position...
      </section>

      <section id="empty" class="center" style="display:none;">
        You are not in the queue
      </section>

      <article id="queue-details" class="queue-details" style="display:none;"></article>

    </section>
  </main>

  <footer>
    © 2026 MediQueue · All rights reserved ·
    <a
      href="#"
      style="color: rgba(255, 255, 255, 0.6); text-decoration:none;"
    >
      Privacy Policy
    </a>
  </footer>

  <script type="module" src="/js/queue.js"></script>

  <script>
    function goToAccount() {
      sessionStorage.setItem(
        "previousPageBeforeAccount",
        window.location.pathname + window.location.search
      );

      window.location.href = "/html/account.html";
    }
  </script>

</body>

</html>
